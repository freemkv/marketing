name: Announce release on Discord

# A release announces DEAD LAST: freemkv's release-orchestrate pushes
# release-ready/vX.Y.Z here only after every tag build, the site deploy and the
# download checks are green. Deploying the site never announces. Dispatch is the
# manual fallback. Each version is claimed once with a durable Git tag before sending.
# Manual dispatch uses the same duplicate guard. A failed/ambiguous send
# leaves its claim in place for explicit operator review (never auto-retry).
on:
  push:
    tags: ['release-ready/v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to announce (blank = newest changelog entry)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: discord-release-announcements
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Post the newest changelog entry to Discord
        env:
          HOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VER_INPUT: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/announce-release.sh
