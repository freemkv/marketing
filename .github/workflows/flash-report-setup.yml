name: Configure private flash reports

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flash-report-setup
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false wrangler@4.143.0
      - name: Verify production account owns the existing site
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/freemkv`, {
            headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}, signal: AbortSignal.timeout(30000),
          });
          const data = await response.json();
          if (!response.ok || !data.success || data.result.name !== 'freemkv' ||
              !data.result.domains?.includes('freemkv.org')) throw new Error('Configured account does not own the existing freemkv.org Pages project; refusing all changes');
          console.log('Verified: configured account serves freemkv.org from the existing freemkv Pages project.');
          JS
      - name: Create private bucket if absent
        run: |
          node --input-type=module <<'JS'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/r2/buckets`;
          const headers = {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json'};
          const existing = await fetch(`${base}/freemkv-flash-reports`, {headers, signal: AbortSignal.timeout(30000)});
          if (existing.status === 404) {
            const created = await fetch(base, {method: 'POST', headers, body: JSON.stringify({name: 'freemkv-flash-reports'}), signal: AbortSignal.timeout(30000)});
            if (!created.ok || !(await created.json()).success) throw new Error('Could not create private report bucket');
          } else if (!existing.ok || !(await existing.json()).success) throw new Error(`Bucket inspection failed: ${existing.status}`);
          const domains = await fetch(`${base}/freemkv-flash-reports/domains/custom`, {headers, signal: AbortSignal.timeout(30000)});
          if (!domains.ok) throw new Error('Could not inspect report bucket custom domains');
          const data = await domains.json();
          if (!data.success || !Array.isArray(data.result?.domains) || data.result.domains.length) throw new Error('Report bucket must have no public custom domains');
          JS
      - name: Enforce private access and 90-day deletion
        run: |
          npx wrangler r2 bucket dev-url disable freemkv-flash-reports
          node --input-type=module <<'JS'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/r2/buckets/freemkv-flash-reports/lifecycle`;
          const headers = {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json'};
          const expected = {id: 'reports-90d', enabled: true, conditions: {prefix: 'flash-reports/'},
            deleteObjectsTransition: {condition: {maxAge: 90 * 24 * 60 * 60, type: 'Age'}}};
          const matches = rule => rule?.id === expected.id && rule.enabled === true
            && rule.conditions?.prefix === expected.conditions.prefix
            && rule.deleteObjectsTransition?.condition?.type === 'Age'
            && rule.deleteObjectsTransition.condition.maxAge === expected.deleteObjectsTransition.condition.maxAge;
          async function getRules() {
            const response = await fetch(endpoint, {headers, signal: AbortSignal.timeout(30000)});
            const data = await response.json();
            if (!response.ok || !data.success || (data.result?.rules != null && !Array.isArray(data.result.rules))) throw new Error('Could not inspect report bucket lifecycle rules');
            return data.result?.rules ?? [];
          }
          let rules = await getRules();
          if (!rules.some(matches)) {
            const updatedRules = [...rules.filter(rule => rule.id !== expected.id), expected];
            const response = await fetch(endpoint, {method: 'PUT', headers, body: JSON.stringify({rules: updatedRules}), signal: AbortSignal.timeout(30000)});
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error('Could not set the report bucket 90-day lifecycle rule');
            rules = await getRules();
          }
          if (!rules.some(matches)) throw new Error('Report bucket 90-day lifecycle rule did not verify');
          console.log('Verified the private report bucket expires flash-reports/ objects after 90 days.');
          JS
      - name: Apply additive report schema
        run: |
          npx wrangler d1 execute freemkv-firmware-verifications-preview --remote --file=migrations/0002_flash_reports.sql
          npx wrangler d1 execute freemkv-firmware-verifications --remote --file=migrations/0002_flash_reports.sql
          for database in freemkv-firmware-verifications-preview freemkv-firmware-verifications; do
            if ! npx wrangler d1 execute "$database" --remote --command='SELECT description FROM flash_report_requests LIMIT 0' >/dev/null 2>&1; then
              npx wrangler d1 execute "$database" --remote --file=migrations/0003_flash_report_description.sql
            fi
            if ! npx wrangler d1 execute "$database" --remote --command='SELECT firmware_inputs_json FROM flash_report_requests LIMIT 0' >/dev/null 2>&1; then
              npx wrangler d1 execute "$database" --remote --file=migrations/0005_flash_report_firmware_inputs.sql
            fi
          done
      - name: Configure Pages report bindings
        run: node scripts/flash-report-pages-setup.mjs --apply
      - name: Deploy private notification worker
        run: node scripts/firmware-email-setup.mjs --apply
      - name: Configure maintainer report recipient
        run: printf '%s' 'matthew@pq.io' | npx wrangler secret put REPORT_TO --name freemkv-verification-email
      - name: Verify report binding configuration
        run: node scripts/flash-report-pages-setup.mjs
