name: Deploy site to Pages

# Builds the Astro/Starlight site and deploys it to CLOUDFLARE Pages
# (project "freemkv" -> freemkv.org). The site moved off GitHub Pages; deploys
# are now a direct wrangler upload of the built dist/ to Cloudflare.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   - freemkv account token with Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  - the freemkv Cloudflare account id
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; cancel a superseded in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build   # astro build -> dist/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=freemkv --branch=main
