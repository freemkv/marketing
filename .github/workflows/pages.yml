name: Deploy site to Pages

# Builds the Astro/Starlight site and deploys it to CLOUDFLARE Pages
# (project "freemkv" -> freemkv.org). The site moved off GitHub Pages; deploys
# are now a direct wrangler upload of the built dist/ to Cloudflare.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   - freemkv account token with Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID  - the freemkv Cloudflare account id
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      firmware_release:
        description: 'Draft release tag containing firmware-assets.tar.gz (empty: site only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: true
    # GitHub requires push access to read unpublished draft release assets.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Withdraw corrupt TD05 and verify replacement before exposing links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/td05-replacement.py
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Download staged firmware release
        if: inputs.firmware_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.firmware_release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern firmware-assets.tar.gz --dir "$RUNNER_TEMP/firmware-download"
      - name: Validate staged archive
        if: inputs.firmware_release != ''
        run: node scripts/firmware-release.mjs extract "$RUNNER_TEMP/firmware-download/firmware-assets.tar.gz" "$RUNNER_TEMP/firmware-stage"
      - name: Install pinned firmware uploader
        run: npm install --no-save --package-lock=false wrangler@4.143.0
      - name: Upload and verify firmware before exposing download links
        if: inputs.firmware_release != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRMWARE_R2_ACCESS: ${{ vars.FIRMWARE_R2_ACCESS }}
        run: node scripts/firmware-release.mjs publish "$RUNNER_TEMP/firmware-stage" --keep-existing
      - name: Withdraw proven-invalid firmware objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRMWARE_R2_ACCESS: ${{ vars.FIRMWARE_R2_ACCESS }}
        run: node scripts/firmware-withdraw.mjs
      - run: npm run build   # astro build -> dist/
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_FIRMWARE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_FIRMWARE_TURNSTILE_SITEKEY }}
      - name: Backfill independent source confirmations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute freemkv-firmware-verifications-preview --remote --file=migrations/0003_crossflash_source_confirmations.sql
          npx wrangler d1 execute freemkv-firmware-verifications --remote --file=migrations/0003_crossflash_source_confirmations.sql
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=freemkv --branch=${{ github.ref_name }}

  archive:
    name: Retain full firmware archive
    needs: deploy
    if: inputs.firmware_release != ''
    # The shared latest object has one writer across every release branch.
    concurrency:
      group: firmware-archive-latest
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Download staged firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.firmware_release }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern firmware-assets.tar.gz --dir "$RUNNER_TEMP/firmware-download"
      - name: Validate staged archive
        run: node scripts/firmware-release.mjs extract "$RUNNER_TEMP/firmware-download/firmware-assets.tar.gz" "$RUNNER_TEMP/firmware-stage"
      - name: Install pinned firmware uploader
        run: npm install --no-save --package-lock=false wrangler@4.143.0
      - name: Materialize and verify complete firmware inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRMWARE_R2_ACCESS: ${{ vars.FIRMWARE_R2_ACCESS }}
        run: node scripts/firmware-release.mjs publish "$RUNNER_TEMP/firmware-stage" --keep-existing
      - name: Retain and verify latest full firmware archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/firmware-release.mjs archive "$RUNNER_TEMP/firmware-stage" "$RUNNER_TEMP/firmware-download/firmware-full.tar.gz"
          python -m pip install boto3==1.43.109
          python scripts/firmware-archive-upload.py "$RUNNER_TEMP/firmware-download/firmware-full.tar.gz"
      - name: Remove temporary GitHub firmware archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.firmware_release }}
        run: gh release delete-asset "$RELEASE_TAG" firmware-assets.tar.gz --repo "$GITHUB_REPOSITORY" --yes
